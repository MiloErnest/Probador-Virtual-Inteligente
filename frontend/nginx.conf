# Configuracion de Nginx para servir el frontend ya compilado.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # La aplicacion es un SPA con rutas del lado del cliente (/probador,
    # /disenar...). Sin esta linea, recargar en cualquier ruta que no sea "/"
    # daria un 404: Nginx buscaria un archivo que no existe. Se le dice que
    # devuelva index.html y deje que React Router resuelva la ruta.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets llevan hash en el nombre (index-a1b2c3.js), asi que cambiarlos
    # cambia la URL: se pueden cachear indefinidamente sin miedo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
