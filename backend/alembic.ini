# Configuración de Alembic.
#
# La URL de la base de datos NO está aquí a propósito: este archivo se versiona
# y contendría la contraseña. `alembic/env.py` la lee de `app.core.config`,
# que a su vez la toma de la variable de entorno DATABASE_URL (regla 7).
#
# Ejecutar siempre desde la carpeta `backend/`:
#   alembic upgrade head       aplica las migraciones pendientes
#   alembic current            revisión aplicada en la base actual
#   alembic history            historial de migraciones
#   alembic check              avisa si los modelos se han separado del esquema

[alembic]
script_location = %(here)s/alembic

# Permite que `env.py` importe el paquete `app` al ejecutar desde `backend/`.
prepend_sys_path = .

path_separator = os

# Nombre de archivo con fecha delante: al listar `versions/` el orden
# alfabético coincide con el cronológico. El hash sigue siendo la identidad
# real de la revisión; la fecha es solo para leerlo cómodamente.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Fechas de las migraciones en UTC, para que no dependan de la zona horaria
# de la máquina que las genera.
timezone = UTC

# sqlalchemy.url se define en env.py. No lo pongas aquí.


[post_write_hooks]
# Sin hooks. Las migraciones se revisan a mano antes de aplicarlas.


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
